[project]
name = "styleprint"
version = "0.1.0"
description = "Learn a speaker's communication style from speech and generate new text in that style."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
download = ["yt-dlp>=2025.1.1"]
transcribe = [
    "mlx-whisper>=0.4.3",
]
analyze = [
    "en-core-web-md",
    "fr-core-news-md",
    "spacy>=3.8,<3.9",
    "wordfreq>=3.1.1",
]

[project.scripts]
styleprint = "styleprint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/styleprint"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
